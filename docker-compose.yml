services:
  checkout-demo:
    build: ./demo
    environment:
      NODE_ENV: production
      PORT: 4100
    ports:
      - "${DEMO_PORT:-4100}:4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 3s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixops}
      POSTGRES_DB: ${POSTGRES_DB:-fixops}
    volumes:
      - fixops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fixops} -d $${POSTGRES_DB:-fixops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-fixops}:${POSTGRES_PASSWORD:-fixops}@postgres:5432/${POSTGRES_DB:-fixops}
      AGENT_URL: ${AGENT_URL:-http://host.docker.internal:4318}
      AGENT_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:-change-me}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-FixOps}
      OPENROUTER_ZDR: ${OPENROUTER_ZDR:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-FixOps <fixops@example.com>}
      ALLOW_INSECURE_REMOTE: ${ALLOW_INSECURE_REMOTE:-false}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "apps/worker/dist/worker.js"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fixops}:${POSTGRES_PASSWORD:-fixops}@postgres:5432/${POSTGRES_DB:-fixops}
      AGENT_URL: ${AGENT_URL:-http://host.docker.internal:4318}
      AGENT_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:-change-me}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_ZDR: ${OPENROUTER_ZDR:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-FixOps <fixops@example.com>}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fixops-postgres:
